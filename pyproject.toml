[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdp"
version = "1.0.0"
description = "Software Defect Prediction using Machine Learning on NASA MDP / PROMISE datasets"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "imbalanced-learn>=0.12",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "tabulate>=0.9",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["sdp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
